<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/snowy-river-logo.svg" type="image/svg+xml">
  <script>
    (function () {
      var pathParts = window.location.pathname.split('/').filter(Boolean);
      var teamStartPath = pathParts[0] === 'team' && pathParts[1] ? '/team/' + encodeURIComponent(decodeURIComponent(pathParts[1])) : '/';
      var teamStartUrl = new URL(teamStartPath, window.location.origin).href;
      var appScope = new URL('/', window.location.origin).href;
      var iconUrl = new URL('/snowy-river-logo.svg', window.location.origin).href;
      var manifest = {
        name: 'Snowy River Shows',
        short_name: 'Shows',
        description: 'Team member show portal for Snowy River shows.',
        id: teamStartUrl,
        start_url: teamStartUrl,
        scope: appScope,
        display: 'standalone',
        background_color: '#020617',
        theme_color: '#020617',
        icons: [
          {
            src: iconUrl,
            sizes: 'any',
            type: 'image/svg+xml',
            purpose: 'any maskable'
          }
        ]
      };
      var manifestBlob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
      var manifestLink = document.createElement('link');
      manifestLink.rel = 'manifest';
      manifestLink.href = URL.createObjectURL(manifestBlob);
      document.head.appendChild(manifestLink);
    })();
  </script>
  <meta name="theme-color" content="#020617" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Shows" />
  <title>Show Management System</title>
  <meta name="description" content="Caravan Show Management Dashboard - Track shows, sales, and team performance" />
  <meta name="author" content="MGX" />

  <meta property="og:title" content="Show Management System" />
  <meta property="og:description" content="Caravan Show Management Dashboard" />
  <meta property="og:type" content="website" />

</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
